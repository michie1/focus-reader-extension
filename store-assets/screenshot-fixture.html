<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Reader screenshot fixture</title>
    <link rel="stylesheet" href="../reader.css">
  </head>
  <body>
    <section class="focus-view" aria-label="Focus Reader">
      <header class="topbar">
        <div>
          <p class="focus-heading">Reading with intention</p>
          <p class="muted">4 / 12</p>
        </div>
        <div class="topbar-actions">
          <button class="button button-quiet" type="button">Theme: Light</button>
          <button class="button button-quiet" type="button">Full text</button>
          <button class="button button-quiet" type="button">Exit</button>
        </div>
      </header>
      <div class="progress" aria-hidden="true"><span style="transform: scaleX(0.3333)"></span></div>
      <main class="focus-main">
        <div class="focus-content">
          <p>A calmer reading pace gives each idea room to land.</p>
        </div>
      </main>
      <nav class="focus-nav" aria-label="Focus navigation">
        <button class="button button-quiet" type="button">Back</button>
        <button class="button button-quiet" type="button">Copy</button>
        <button class="button button-primary" type="button">Next</button>
      </nav>
    </section>
  </body>
</html>
